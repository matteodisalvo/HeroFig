# Type-checks the code, runs the checks (library, images, translations, onboarding, profile,
# feedback) and builds the web bundle, on every push to main and on every pull request.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Type-check
        run: npm run typecheck
      - name: Checks
        run: npm run check
      - name: Build
        run: npx vite build

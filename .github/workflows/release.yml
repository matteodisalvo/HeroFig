# Builds the macOS disk images, the Windows installer and the Linux packages (AppImage, deb,
# rpm, pacman, apk, tar.gz), and attaches them to a GitHub release. It runs when a version tag
# is pushed (git tag v<version> && git push origin v<version>), or by hand from the Actions tab,
# which only builds them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run dist:mac
            files: release/*.dmg
          - os: windows-latest
            build: npm run dist:win
            files: release/*.exe
          - os: ubuntu-latest
            build: npm run dist:linux
            files: release/*
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      # rpm and pacman packages are built with fpm, which needs rpmbuild and bsdtar.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools fakeroot
      - name: Build
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: herofig-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

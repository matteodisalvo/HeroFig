# Builds the macOS disk images and the Windows installer, and attaches them to a GitHub
# release. It runs when a version tag is pushed (git tag v<version> && git push origin v<version>),
# or by hand from the Actions tab, which only builds them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run dist:mac
            files: release/*.dmg
          - os: windows-latest
            build: npm run dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: herofig-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
